services:
  web:
    container_name: amaneta-log-web
    build:
      context: .
      dockerfile: apps/web/dockerfile.dev
    working_dir: /app/apps/web
    command: pnpm dev
    ports:
      - "${WEB_PORT}:${WEB_PORT}"
    env_file:
      - ./apps/web/.env
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_app_node_modules:/app/apps/web/node_modules
      - web_next:/app/apps/web/.next
    depends_on:
      - api

  api:
    container_name: amaneta-log-api
    build:
      context: .
      dockerfile: apps/api/dockerfile.dev
    working_dir: /app/apps/api
    command: pnpm dev
    ports:
      - "${API_PORT}:${API_PORT}"
      - "${API_PRISMA_STUDIO_PORT}:${API_PRISMA_STUDIO_PORT}"
    env_file:
      - ./apps/api/.env
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - api_app_node_modules:/app/apps/api/node_modules
    depends_on:
      - postgres
      - minio

  postgres:
    container_name: amaneta-log-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    container_name: amaneta-log-minio
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    ports:
      - "${MINIO_PORT}:${MINIO_PORT}"
      - "${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-amaneta_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-amaneta_minio_password}
    volumes:
      - minio_data:/data

volumes:
  web_node_modules:
  web_app_node_modules:
  web_next:
  api_node_modules:
  api_app_node_modules:
  postgres_data:
  minio_data:
